name: verifit

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: docker
    APP_DEBUG: "false"
    DB_PATH: /app/data/savings.db
    CHECKPOINT_PATH: /app/data/conversations.sqlite
    REDIS_URL: redis://redis:6379/0
    CACHE_ENABLED: ${CACHE_ENABLED:-true}
  volumes:
    - ${VERIFIT_DATA_DIR:-./data}:/app/data
  init: true

services:
  redis:
    image: redis:7.4-alpine
    # Cache only: no host port, no persistent copy of user prompts/results.
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${VERIFIT_API_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:${VERIFIT_WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped

  # Explicit execution only: collection invokes paid Gemini APIs.
  batch:
    <<: *backend
    profiles: [batch]
    command: [python, scripts/run_savings_batch.py, --db-path, /app/data/savings.db]
    restart: "no"
    depends_on:
      redis:
        condition: service_started
